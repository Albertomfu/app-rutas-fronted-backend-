<header class="header">
  <div class="header-container">
    <div class="brand">
      <a routerLink="/" class="logo-link" aria-label="Ir al inicio">
        <!-- <img src="logoExtreruta.png" alt="ExtreRutas" class="logo-img" /> -->
        <div class="brand-copy">
          <strong>ExtreRutas</strong>
          <span>Turismo natural de Extremadura</span>
        </div>
      </a>
    </div>

    <nav class="nav-center" aria-label="Navegacion principal">
      <a
        routerLink="/"
        class="nav-link"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        >Inicio</a
      >
      <a routerLink="/rutas" class="nav-link" routerLinkActive="active"
        >Explorar</a
      >
      <a routerLink="/zonas" class="nav-link" routerLinkActive="active">Zonas</a>
      <a routerLink="/info" class="nav-link" routerLinkActive="active"
        >Consejos</a
      >
    </nav>

    <div class="nav-right">
      <ng-container *ngIf="!usuario">
        <a routerLink="/login" class="login">Iniciar sesión</a>
        <a routerLink="/register" class="register">Crear cuenta</a>
      </ng-container>

      <ng-container *ngIf="usuario">
        <span class="user">{{ usuario.nombre }}</span>

        <a *ngIf="usuario.role === 'admin'" routerLink="/admin" class="admin">
          Panel Admin
        </a>

        <a (click)="logout()" class="logout">Salir</a>
      </ng-container>
    </div>
  </div>
</header>
